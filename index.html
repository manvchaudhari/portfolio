<style>
:root {
  --red: #e4311f;
  --red-dark: #b81f10;
  --ink: #0b0b0d;
  --gold: #ffd400;
  --white: #ffffff;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --hud: "Chakra Petch", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--red); }
body {
  font-family: var(--hud); font-weight: 500; color: var(--white);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; cursor: crosshair;
}

/* ---------- arena: red poster with halftone dots and speed lines ---------- */
.arena { position: relative; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--red); }
.arena::before {
  content: ""; position: absolute; inset: -10%; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgba(0,0,0,.2) 1.5px, transparent 1.8px);
  background-size: 14px 14px;
}
.arena::after {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 50% 52%, rgba(255,255,255,.1) 0 3deg, transparent 3deg 9deg);
  -webkit-mask-image: radial-gradient(circle at 50% 52%, transparent 18%, #000 75%);
          mask-image: radial-gradient(circle at 50% 52%, transparent 18%, #000 75%);
}

/* ---------- HUD ---------- */
.hud {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: clamp(8px, 2vw, 28px); align-items: start;
  padding: clamp(10px, 2vh, 20px) clamp(12px, 3vw, 40px) 0;
}
.fighter { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.p2 { align-items: flex-end; text-align: right; }
.name {
  font: 900 clamp(18px, min(4vh, 7vw), 40px)/1 var(--display); text-transform: uppercase; letter-spacing: .04em;
  text-shadow: 2px 2px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%;
}
.bar {
  position: relative; width: 100%; height: clamp(18px, 3.4vh, 30px);
  background: var(--ink); border: 3px solid var(--white); transform: skewX(-16deg); overflow: hidden;
}
.fill, .ghost { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; }
.fill  { background: var(--gold); transition: width .12s linear; }
.ghost { background: var(--white); transition: width .5s ease .3s; }
.p2 .fill, .p2 .ghost { left: auto; right: 0; }
.sub-name { font-size: clamp(11px, 1.7vh, 14px); font-weight: 700; letter-spacing: .06em; text-shadow: 1px 1px 0 var(--ink); }

.center { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px; }
.rd {
  background: var(--ink); padding: 4px 16px 6px; text-align: center; transform: skewX(-16deg);
  border: 3px solid var(--white);
}
.rd > * { display: block; transform: skewX(16deg); }
.rd-label { font-size: clamp(10px, 1.6vh, 13px); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.rd-num { font: 900 clamp(22px, 4vh, 38px)/1 var(--display); color: var(--gold); letter-spacing: .03em; }
.combo { min-height: 1.3em; font: 900 clamp(16px, 2.6vh, 24px)/1.3 var(--display); text-transform: uppercase; color: var(--gold); text-shadow: 2px 2px 0 var(--ink); letter-spacing: .04em; }

/* ---------- stage: the opponent word ---------- */
.stage {
  position: relative; z-index: 2; flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  gap: clamp(6px, 1.5vh, 16px); padding: 0 3vw;
}
.word {
  font-family: var(--display); font-weight: 900; text-transform: uppercase; line-height: .85;
  white-space: nowrap; color: var(--white);
  -webkit-text-stroke: .03em var(--ink); paint-order: stroke fill;
  text-shadow: .045em .055em 0 var(--ink);
  transition: color .05s;
}
.word.hit { color: var(--gold); }
.letter { display: inline-block; }
.taunt {
  margin: 0; background: var(--ink); color: var(--gold); font-weight: 700;
  font-size: clamp(13px, 2.2vh, 20px); padding: 6px 16px; transform: rotate(-1deg); letter-spacing: .02em;
}
.headline {
  margin: clamp(2px, 1vh, 10px) 0 0; font: 900 clamp(24px, min(5.2vh, 8vw), 58px)/1 var(--display);
  text-transform: uppercase; letter-spacing: .03em; text-shadow: 3px 3px 0 var(--ink);
}
.how { margin: 0; font-size: clamp(12px, 1.9vh, 17px); font-weight: 700; text-shadow: 1px 1px 0 var(--ink); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.rematch {
  font: 900 clamp(20px, 3.4vh, 30px)/1 var(--display); text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink); background: var(--gold); border: 4px solid var(--ink); padding: 10px 28px;
  box-shadow: 5px 5px 0 var(--ink); cursor: pointer; transform: skewX(-10deg);
}
.rematch:active { transform: skewX(-10deg) translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }
.rematch:focus-visible, .mail:focus-visible { outline: 4px solid var(--white); outline-offset: 3px; }
.rematch[hidden] { display: none; }

/* ---------- build bar ---------- */
.build {
  position: relative; z-index: 2; display: flex; align-items: center; gap: clamp(8px, 2vw, 18px);
  background: var(--ink); padding: clamp(8px, 1.4vh, 14px) clamp(12px, 3vw, 40px); border-top: 4px solid var(--gold);
}
.build-label { font-weight: 700; font-size: clamp(11px, 1.8vh, 15px); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.track { position: relative; flex: 1; height: clamp(12px, 2vh, 18px); border: 2px solid var(--white); transform: skewX(-16deg); overflow: hidden; min-width: 40px; }
.track > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); transition: width .4s ease; }
.pct { font: 900 clamp(20px, 3.4vh, 32px)/1 var(--display); color: var(--gold); min-width: 3ch; text-align: right; }
.mail {
  display: inline-flex; align-items: center; gap: .4em; padding-bottom: 3px;
  color: var(--gold); font-weight: 700; font-size: clamp(11px, 1.8vh, 15px);
  text-decoration: none; border-bottom: 2px solid currentColor; white-space: nowrap;
}
.mail svg { width: 1.4em; height: 1.4em; flex: none; }

/* ---------- overlays ---------- */
.banner {
  position: absolute; left: 0; right: 0; top: 50%; z-index: 6; display: none;
  background: var(--ink); color: var(--white); text-align: center; white-space: nowrap;
  font: 900 clamp(48px, 17vh, 170px)/1 var(--display); text-transform: uppercase; letter-spacing: .04em;
  padding: .06em 0 .02em; border-top: 5px solid var(--gold); border-bottom: 5px solid var(--gold);
  pointer-events: none;
}
.banner.gold { color: var(--gold); }
.flash { position: absolute; inset: 0; z-index: 7; background: #fff; opacity: 0; pointer-events: none; }
.fx { position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden; }
.num {
  position: absolute; transform: translate(-50%, -50%); font: 900 clamp(30px, 6vh, 56px)/1 var(--display); color: var(--gold);
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; letter-spacing: .02em;
}
.star { position: absolute; width: 100px; height: 100px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* short screens: trim extras so nothing needs a scrollbar */
@media (max-height: 560px) { .how, .sub-name { display: none; } }
@media (max-height: 400px) { .taunt { display: none; } .email { display: none; } }
@media (max-width: 760px) { .email { display: none; } }
@media (max-width: 520px) {
  .build { flex-wrap: wrap; row-gap: 8px; }
  .build-label { order: 1; flex: 1 1 0; white-space: normal; font-size: 11px; line-height: 1.2; }
  .pct { order: 2; }
  .track { order: 3; flex: 1 0 100%; }
  .x { order: 4; }
}
@media (prefers-reduced-motion: reduce) { .how { animation: none; } }
</style>
</head>
<body>
<div class="arena" id="arena">

  <header class="hud">
    <div class="fighter p1" id="p1">
      <span class="name">Manav</span>
      <div class="bar"><div class="fill" id="p1fill" style="width:100%"></div></div>
      <span class="sub-name" id="p1sub">energy: caffeinated</span>
    </div>
    <div class="center">
      <div class="rd"><span class="rd-label">Round</span><span class="rd-num" id="roundNum">1/5</span></div>
      <span class="combo" id="combo"></span>
    </div>
    <div class="fighter p2">
      <span class="name" id="p2Name">CSS</span>
      <div class="bar"><div class="ghost" id="ghost"></div><div class="fill" id="p2fill"></div></div>
      <span class="sub-name">bug level: high</span>
    </div>
  </header>

  <main class="stage">
    <div class="word" id="word" aria-hidden="true"></div>
    <p class="taunt" id="taunt"></p>
    <h1 class="headline">the site’s under construction</h1>
    <p class="how" id="how">Tap, click or press space to attack. Every bug you squash speeds things up.</p>
    <button class="rematch" id="rematch" type="button" hidden>Rematch</button>
  </main>

  <footer class="build">
    <span class="build-label" id="buildLabel">Portfolio build</span>
    <div class="track"><i id="buildFill"></i></div>
    <span class="pct" id="pct">0%</span>
    <a class="mail email" href="mailto:hello@manav.gg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 7.5l9 6.5 9-6.5"/></svg>hello@manav.gg</a>
    <a class="mail x" href="https://x.com/manvchaudhari" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>@manvchaudhari</a>
  </footer>

  <div class="banner" id="banner" aria-hidden="true"></div>
  <div class="flash" id="flash"></div>
</div>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var arena = $("arena"), word = $("word"), taunt = $("taunt"), how = $("how"), rematch = $("rematch"),
      p2Name = $("p2Name"), p2fill = $("p2fill"), ghost = $("ghost"), roundNum = $("roundNum"), comboEl = $("combo"),
      pctEl = $("pct"), buildFill = $("buildFill"), buildLabel = $("buildLabel"),
      banner = $("banner"), flash = $("flash"), fx = $("fx"), live = $("live"),
      p1 = $("p1"), p1fill = $("p1fill"), p1sub = $("p1sub");
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function irnd(a, b) { return Math.round(rnd(a, b)); }

  var OPP = [
    { w: "CSS",        t: "I will not center that div." },
    { w: "JavaScript", t: "undefined is not a function." },
    { w: "Flexbox",    t: "justify-content? align-items? Good luck." },
    { w: "DNS",        t: "It's always DNS." },
    { w: "Git",        t: "Detached HEAD. You're on your own." }
  ];
  var idx = 0, hp = 100, locked = true, over = false, cleared = 0, combo = 0, lastHit = 0, comboT = null;

  /* ---------- sizing the big word to fit ---------- */
  function fit() {
    var stage = document.querySelector(".stage");
    var maxW = stage.clientWidth * 0.94;
    var size = Math.min(innerHeight * 0.34, innerWidth * 0.42);
    word.style.fontSize = size + "px";
    var w = word.getBoundingClientRect().width;
    if (w > maxW) word.style.fontSize = (size * maxW / w) + "px";
  }
  addEventListener("resize", fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  /* ---------- HUD helpers ---------- */
  function setHP(v) { p2fill.style.width = v + "%"; ghost.style.width = v + "%"; }
  function updatePct() {
    var frac = over ? 0.99 : Math.min(0.99, (cleared + (100 - hp) / 100) / OPP.length * 0.99);
    var p = Math.round(frac * 100);
    pctEl.textContent = p + "%"; buildFill.style.width = p + "%";
  }
  function announce(text, ms, gold) {
    return new Promise(function (resolve) {
      banner.textContent = text; banner.className = "banner" + (gold ? " gold" : ""); banner.style.display = "block";
      var frames = reduce
        ? [{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 1, offset: .85 }, { opacity: 0 }]
        : [{ transform: "translateY(-50%) translateX(-105%) skewX(-12deg)" },
           { transform: "translateY(-50%) translateX(0) skewX(-12deg)", offset: .16 },
           { transform: "translateY(-50%) translateX(0) skewX(-12deg)", offset: .84 },
           { transform: "translateY(-50%) translateX(105%) skewX(-12deg)" }];
      if (reduce) banner.style.transform = "translateY(-50%)";
      var a = banner.animate(frames, { duration: ms, easing: "ease-in-out" });
      a.onfinish = function () { banner.style.display = "none"; resolve(); };
    });
  }
  function buildWord(text) {
    word.innerHTML = "";
    text.split("").forEach(function (ch) {
      var s = document.createElement("span"); s.className = "letter"; s.textContent = ch; word.appendChild(s);
    });
    fit();
  }

  /* ---------- rounds ---------- */
  function load(i) {
    idx = i; hp = 100; locked = true;
    ghost.style.transition = "none"; setHP(100); void ghost.offsetWidth; ghost.style.transition = "";
    buildWord(OPP[i].w);
    taunt.textContent = OPP[i].t; taunt.hidden = false;
    p2Name.textContent = OPP[i].w;
    roundNum.textContent = (i + 1) + "/" + OPP.length;
    live.textContent = "Round " + (i + 1) + ": " + OPP[i].w + ". " + OPP[i].t;
    updatePct();
    word.animate(reduce ? [{ opacity: 0 }, { opacity: 1 }]
      : [{ transform: "translateY(-70%) scale(1.5)", opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 420, easing: "cubic-bezier(.2,1.4,.4,1)" });
    announce("Round " + (i + 1), 900).then(function () { return announce("Fight!", 700); }).then(function () { locked = false; });
  }

  /* ---------- hit effects ---------- */
  function star(x, y) {
    var pts = [];
    for (var i = 0; i < 24; i++) { var r = i % 2 ? 22 : 47, a = i * Math.PI / 12; pts.push((50 + r * Math.cos(a)).toFixed(1) + "," + (50 + r * Math.sin(a)).toFixed(1)); }
    var wrap = document.createElement("div"); wrap.className = "star";
    wrap.style.left = (x - 50) + "px"; wrap.style.top = (y - 50) + "px";
    wrap.innerHTML = '<svg viewBox="0 0 100 100" width="100" height="100"><polygon points="' + pts.join(" ") + '" fill="#ffd400" stroke="#0b0b0d" stroke-width="4" stroke-linejoin="round"/></svg>';
    fx.appendChild(wrap);
    var a = wrap.animate([{ transform: "scale(.3) rotate(" + irnd(-30, 30) + "deg)", opacity: 1 }, { transform: "scale(1.15) rotate(" + irnd(-30, 30) + "deg)", opacity: 0 }], { duration: 300, easing: "ease-out" });
    a.onfinish = function () { wrap.remove(); };
  }
  function floatNum(text, x, y) {
    var n = document.createElement("div"); n.className = "num"; n.textContent = text;
    n.style.left = x + "px"; n.style.top = y + "px"; fx.appendChild(n);
    var a = n.animate([{ transform: "translate(-50%,-50%) scale(.6)", opacity: 1 }, { transform: "translate(-50%,-50%) scale(1.1)", opacity: 1, offset: .2 }, { transform: "translate(-50%,-190%) scale(1)", opacity: 0 }], { duration: 750, easing: "ease-out" });
    a.onfinish = function () { n.remove(); };
  }
  function shake() {
    if (reduce) return;
    arena.animate([{ transform: "translate(0,0)" }, { transform: "translate(" + irnd(-8, 8) + "px," + irnd(-8, 8) + "px)" }, { transform: "translate(0,0)" }], { duration: 150 });
  }
  function punch() {
    word.classList.add("hit"); setTimeout(function () { word.classList.remove("hit"); }, 90);
    if (!reduce) word.animate([{ transform: "scale(1.05) rotate(" + (Math.random() < .5 ? -1.2 : 1.2) + "deg)" }, { transform: "none" }], { duration: 160 });
  }
  function glitch() {
    var L = word.children; if (!L.length) return;
    var saved = [], n = Math.min(2, L.length), chars = "#%&@$!?*";
    for (var i = 0; i < n; i++) {
      var k = irnd(0, L.length - 1);
      saved.push([k, L[k].textContent]); L[k].textContent = chars.charAt(irnd(0, chars.length - 1));
    }
    var snapshot = word;
    setTimeout(function () { if (snapshot === word) saved.forEach(function (s) { if (L[s[0]]) L[s[0]].textContent = s[1]; }); }, 120);
  }
  function showCombo() {
    clearTimeout(comboT);
    comboEl.textContent = combo >= 2 ? combo + " hit combo" : "";
    comboT = setTimeout(function () { comboEl.textContent = ""; }, 900);
  }

  /* ---------- attack ---------- */
  function attack(x, y) {
    if (locked || over) return;
    var now = performance.now();
    combo = (now - lastHit < 750) ? combo + 1 : 1; lastHit = now;
    var dmg = irnd(7, 13) + Math.min(combo - 1, 4) * 2;
    hp = Math.max(0, hp - dmg); setHP(hp);
    star(x, y); floatNum("-" + dmg, x, y - 20); shake(); punch(); glitch(); showCombo(); updatePct();
    if (hp <= 0) ko();
  }

  function ko() {
    locked = true; cleared++;
    var letters = Array.prototype.slice.call(word.children);
    letters.forEach(function (l) {
      l.animate(reduce ? [{ opacity: 1 }, { opacity: 0 }]
        : [{ transform: "none", opacity: 1 }, { transform: "translate(" + irnd(-340, 340) + "px," + irnd(-260, 260) + "px) rotate(" + irnd(-540, 540) + "deg) scale(.4)", opacity: 0 }],
        { duration: 900, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards" });
    });
    taunt.hidden = true;
    flash.animate([{ opacity: .9 }, { opacity: 0 }], { duration: 260 });
    shake();
    live.textContent = OPP[idx].w + " defeated.";
    updatePct();
    announce("K.O.", 1200, true).then(function () {
      if (cleared >= OPP.length) finish(); else load(idx + 1);
    });
  }

  /* ---------- finale: the last bug lands a blow, you go down (not K.O.), recover, restart ---------- */
  function finish() {
    over = true; locked = true;
    buildWord("BUGS");
    p2Name.textContent = "Bugs"; roundNum.textContent = "BOSS";
    ghost.style.transition = "none"; setHP(100); void ghost.offsetWidth; ghost.style.transition = "";
    how.hidden = true; rematch.hidden = true;
    taunt.hidden = false; taunt.textContent = "One last bug survived. Surprise.";
    buildLabel.textContent = "The last 1% is the hardest";
    updatePct();
    live.textContent = "All five rounds cleared. One last bug strikes back.";
    word.animate(reduce ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: "scale(.2) rotate(-12deg)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 500, easing: "cubic-bezier(.2,1.5,.4,1)" });

    var fallAnim = null;
    sleep(1300).then(function () {
      // the bug lunges at you
      if (!reduce) word.animate([
        { transform: "none" },
        { transform: "translateX(-6vw) scale(.9) rotate(3deg)", offset: .25 },
        { transform: "translateX(-34vw) scale(1.3) rotate(-7deg)", offset: .6 },
        { transform: "none" }
      ], { duration: 650, easing: "ease-in-out" });
      return sleep(reduce ? 100 : 400);
    }).then(function () {
      // impact on the player
      var r = p1.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      flash.animate([{ opacity: .95 }, { opacity: 0 }], { duration: 380 });
      shake(); setTimeout(shake, 120);
      star(cx, cy); star(cx - 40, cy + 18); star(cx + 50, cy - 12);
      floatNum("-94", cx, cy - 20);
      p1fill.style.transition = "width .35s ease-out"; p1fill.style.width = "6%";
      p1sub.textContent = "energy: ouch";
      live.textContent = "Bugs lands a heavy blow. Manav is down, but not out.";
      if (!reduce) {
        p1.style.transformOrigin = "0 100%";
        fallAnim = p1.animate([
          { transform: "none", filter: "none" },
          { transform: "translateX(-16px) rotate(-7deg)", filter: "brightness(2)", offset: .25 },
          { transform: "translateY(56px) rotate(-14deg)", filter: "grayscale(.8)" }
        ], { duration: 650, easing: "ease-out", fill: "forwards" });
      }
      return sleep(700);
    }).then(function () {
      taunt.textContent = "Down… but not out.";
      return announce("Down!", 1300);
    }).then(function () {
      // get back up, health refills
      taunt.textContent = "Back on your feet. Health restored.";
      p1sub.textContent = "energy: caffeinated";
      p1fill.style.transition = "width 1.6s ease-in-out"; p1fill.style.width = "100%";
      if (fallAnim) fallAnim.cancel();
      if (!reduce) p1.animate([
        { transform: "translateY(56px) rotate(-14deg)", filter: "grayscale(.8)" },
        { transform: "translateY(-10px) rotate(2deg)", filter: "none", offset: .7 },
        { transform: "none", filter: "none" }
      ], { duration: 700, easing: "ease-out" });
      return sleep(2000);
    }).then(function () {
      // everything restarts
      p1fill.style.transition = ""; p1.style.transformOrigin = "";
      over = false; cleared = 0; combo = 0; how.hidden = false;
      buildLabel.textContent = "Portfolio build";
      load(0);
    });
  }

  rematch.addEventListener("click", function () {
    over = false; cleared = 0; how.hidden = false; rematch.hidden = true;
    buildLabel.textContent = "Portfolio build"; load(0);
  });

  /* ---------- input: tap/click anywhere, or space/enter ---------- */
  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest("a,button")) return;
    attack(e.clientX, e.clientY);
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === " " || e.key === "Enter") && !e.repeat && !e.target.closest("button,a")) {
      e.preventDefault();
      var r = word.getBoundingClientRect();
      attack(r.left + r.width / 2 + rnd(-r.width / 4, r.width / 4), r.top + r.height / 2);
    }
  });

  load(0);
})();
</script>
</body>
</html>
