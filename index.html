<style>
:root{
  --bg:#0e0e12;--ink:#f2efe8;--muted:#9a98a3;--accent:#d93a3a;--hz:#f2b705;
  --line:#ffffff55;--line2:#ffffff33;--panel:#ffffff08;--grid:#ffffff08;--gl:26%;--glowc:#fff8;color-scheme:dark;
  --cw:clamp(46px,min(13vw,9.4vh),82px);
  --serif:'Instrument Serif','Georgia','Times New Roman',serif;
  --sans:'Archivo','Helvetica Neue','Segoe UI',Arial,sans-serif;
}
:root[data-theme=light]{--bg:#f3f3f6;--ink:#17171d;--muted:#6b6975;--line:#17171d55;--line2:#17171d33;--panel:#17171d08;--grid:#17171d0a;--gl:18%;--glowc:#0006;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:radial-gradient(ellipse 55% 40% at 50% 62%,color-mix(in srgb,var(--accent) var(--gl),transparent),transparent 72%),
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/36px 36px,var(--bg);transition:background .5s}
.hz{flex:none;height:8px;position:relative;overflow:hidden}
.hz::before{content:'';position:absolute;top:0;bottom:0;left:0;right:-60px;background:repeating-linear-gradient(-45deg,var(--hz) 0 10px,#111 10px 20px);animation:hz .9s linear infinite}
@keyframes hz{to{transform:translateX(-28.2843px)}}

/* layout */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(210px,260px) minmax(0,1fr) minmax(210px,260px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"left hero right" "left table right"}
.left{grid-area:left}.hero{grid-area:hero}.table{grid-area:table}.right{grid-area:right}
.side{display:flex;flex-direction:column;align-items:flex-start;gap:26px;padding:36px 32px 24px;min-height:0}

/* left sidebar */
.brand{font-family:var(--serif);font-size:30px;line-height:1;letter-spacing:-.01em}
.contact{display:flex;flex-direction:column;gap:4px;width:100%;border:1.5px solid var(--line);border-radius:16px;padding:10px;background:var(--panel)}
.contact a{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px 18px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:700;outline:none}
.contact a::after{content:'';position:absolute;left:14px;right:14px;bottom:8px;height:5px;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--hz) 0 5px,#111 5px 10px);transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.contact a svg{width:16px;height:16px;flex:none;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.contact a span{transition:transform .3s}
.contact a:hover::after,.contact a:focus-visible::after{transform:scaleX(1)}
.contact a:hover svg,.contact a:focus-visible svg{transform:rotate(-16deg) scale(1.25)}
.contact a:hover span,.contact a:focus-visible span{transform:translateX(4px)}
.theme{margin-top:auto;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:border-color .2s}
.theme svg{transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.theme:hover,.theme:focus-visible{border-color:var(--hz);outline:none}
.theme:hover svg,.theme:focus-visible svg{transform:rotate(90deg)}
.theme .moon{display:none}
html[data-theme=light] .theme .sun{display:none}
html[data-theme=light] .theme .moon{display:block}

/* hero */
.hero{text-align:center;padding:30px 16px 0}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,min(9.2vw,11vh),96px);line-height:1;letter-spacing:-.015em}
.rule{width:72px;height:8px;margin:16px auto 0;border-radius:2px;background:repeating-linear-gradient(-45deg,var(--hz) 0 8px,#111 8px 16px)}
.lede{margin:14px auto 0;max-width:30em;font-size:clamp(14px,2.1vh,17px);color:var(--muted);line-height:1.45}

/* right sidebar */
.panel{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--panel)}
.panel h2{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}
.score{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.who{display:flex;flex-direction:column;gap:2px;transition:opacity .3s}
.who b{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1}
.who span{font-size:13px;font-weight:700}
.score i{font-style:normal;font-size:12px;color:var(--muted);padding-bottom:6px}
.score.p .who.b,.score.b .who.p{opacity:.45}
.rounds{margin-top:12px;font-size:12px;color:var(--muted)}
.win{border:1.5px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.win .bar{display:flex;align-items:center;gap:3px;padding:4px 6px;border-bottom:1.5px solid var(--line2)}
.win .bar i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.win .live{margin-left:auto;font-size:8px;font-weight:700;border:1px dashed var(--line);border-radius:99px;padding:0 6px;color:var(--muted);animation:pl 1.8s infinite}
@keyframes pl{50%{opacity:.35}}
.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px}
.pg b{display:block;border:1px dashed var(--line);border-radius:2px;transition:background .5s,border-color .5s}
.pg b.on{background:var(--accent);border-color:transparent;animation:drop .5s}
@keyframes drop{from{transform:scale(.4);opacity:0}}
.b0{grid-column:1/7;height:7px}.b1{grid-column:1/4;height:10px}.b2{grid-column:1/4;height:7px}.b3{grid-column:4/7;grid-row:2/5}
.b4{grid-column:1/3;height:10px}.b5,.b6,.b7{grid-column:span 2;height:18px}.b8{grid-column:1/7;height:6px}

/* game */
.table{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:0 12px;min-height:0}
.wait{font-size:13px;color:var(--muted);font-weight:500}
.opp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:500}
.opp .fan{display:flex}
.back{width:calc(var(--cw)*.42);height:calc(var(--cw)*.62);border-radius:4px;background:#1a1a22;border:1.5px solid color-mix(in srgb,var(--ink) 65%,transparent);margin-left:calc(var(--cw)*-.24);position:relative}
.back:first-child{margin-left:0}
.back::after{content:'';position:absolute;inset:22% 18%;border-radius:50%;background:#d93a3a;transform:rotate(28deg)}
.stage{display:flex;align-items:center;gap:calc(var(--cw)*.4)}
.slot{position:relative;width:var(--cw);height:calc(var(--cw)*1.5)}
.slot small{position:absolute;left:0;right:0;top:calc(100% + 6px);text-align:center;font-size:11px;color:var(--muted);font-weight:500}
button.deck{border:0;background:none;color:inherit;cursor:pointer;font:inherit}
.deck .back{position:absolute;inset:0;width:100%;height:100%;margin:0;border-radius:calc(var(--cw)*.1);border-width:calc(var(--cw)*.045);transition:transform .15s}
.deck .back:nth-child(1){transform:translate(4px,4px)}.deck .back:nth-child(2){transform:translate(2px,2px)}
.deck:hover .back:last-child{transform:translateY(-4px)}
.deck.pulse .back:last-child{animation:nudge 1.1s infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
.pile .card{position:absolute;inset:0;pointer-events:none}
.pile .card.land{animation:land .35s cubic-bezier(.2,.8,.3,1.2)}
@keyframes land{from{transform:scale(1.5) rotate(0);opacity:.2}}
.col{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.col i{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);transition:background .4s}
.say{text-align:center;min-height:3.2em;max-width:min(92vw,30em)}
.say p{font-size:clamp(14px,2.2vh,16px);font-weight:700;line-height:1.3;animation:fade .3s}
.say small{display:block;margin-top:3px;font-size:12px;color:var(--muted);min-height:1.2em}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.again{margin-top:6px;font:700 13px var(--sans);color:var(--bg);background:var(--ink);border:0;border-radius:99px;padding:7px 16px;cursor:pointer}
.again[hidden]{display:none}
.hand{flex:none;display:flex;justify-content:center;align-items:flex-end;height:calc(var(--cw)*1.5 + 48px);padding:0 8px 26px;position:relative;z-index:1}
.hand .card{transform-origin:50% 130%;transform:translateY(var(--dy,0)) rotate(var(--rot,0deg));transition:transform .18s,opacity .2s,filter .2s}
.hand .card.dim{opacity:.4}
.hand .card.can{cursor:pointer}
.hand .card.can:hover,.hand .card.can:focus-visible{transform:translateY(-18px) rotate(0) scale(1.08);z-index:5;outline:none;filter:drop-shadow(0 0 8px var(--glowc))}
.hand .card.new{animation:deal .4s backwards}
@keyframes deal{from{opacity:0;transform:translateY(-120px) scale(.7)}}
.card{width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.1);border:calc(var(--cw)*.045) solid #f6f3ec;background:var(--c);position:relative;flex:none;font-family:var(--sans);font-weight:800;font-style:italic;user-select:none;-webkit-user-select:none;box-shadow:0 2px 6px #0007}
.card .oval{position:absolute;inset:13% 9%;background:#f6f3ec;border-radius:50%;transform:rotate(28deg);display:grid;place-items:center}
.card .mid{transform:rotate(-28deg);color:var(--c);font-size:calc(var(--cw)*.48);line-height:1;letter-spacing:-.04em}
.card .mid.sm{font-size:calc(var(--cw)*.36)}
.card .tl,.card .br{position:absolute;color:#fff;font-size:calc(var(--cw)*.17);line-height:1}
.card .tl{top:6%;left:10%}.card .br{bottom:6%;right:10%;transform:rotate(180deg)}
.card.wild{--c:#17171d}
.quad{width:72%;aspect-ratio:1;border-radius:50%;transform:rotate(-28deg);background:conic-gradient(#d93a3a 0 25%,#2b6fd6 0 50%,#2e9e5b 0 75%,#f2b705 0);display:grid;place-items:center;color:#fff;font-size:calc(var(--cw)*.28);text-shadow:0 0 3px #000,0 0 3px #000}
footer{flex:none;position:relative;z-index:2;display:flex;justify-content:center;padding:6px 12px 14px}
.uno{font:800 italic 14px var(--sans);color:#fff;background:var(--accent);border:2px solid var(--ink);border-radius:99px;padding:.4em 1em;cursor:pointer;opacity:.5;transition:background .4s}
.uno.pulse{opacity:1;animation:pu .6s infinite alternate}
@keyframes pu{to{transform:scale(1.14)}}
.picker{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20}
.picker[hidden]{display:none}
.picker div{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;text-align:center;font-weight:700;font-size:14px}
.picker nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.picker button{width:64px;height:64px;border-radius:50%;border:3px solid #fff;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* small screens: one column, sidebars become slim rows */
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr);grid-template-areas:"left" "hero" "right" "table"}
  .side{padding:0 16px}
  .left{flex-direction:row;align-items:center;gap:10px;padding-top:12px}
  .brand{font-size:24px;margin-right:auto}
  .contact{order:2;flex-direction:row;width:auto;gap:8px;border:0;padding:0;background:none}
  .contact a{width:34px;height:34px;padding:0;justify-content:center;border:1.5px solid var(--line);border-radius:50%}
  .contact a span,.contact a::after{display:none}
  .theme{order:3;margin-top:0}
  .hero{padding-top:10px}
  .rule{display:none}
  .lede{margin-top:8px;font-size:14px}
  .right{flex-direction:row;align-items:stretch;gap:10px;padding-top:10px;padding-bottom:0}
  .panel{padding:8px 12px;border-radius:12px}
  .right .panel:first-child{flex:1}
  .right .build{width:132px;flex:none}
  .panel h2{margin-bottom:6px;font-size:12px}
  .who b{font-size:28px}.who span{font-size:12px}
  .rounds{display:none}
  .pg{padding:5px;gap:3px}
  .b5,.b6,.b7{height:10px}.b3{grid-row:2/4}
}
@media (max-height:640px){.lede,.wait,.rule{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>

<script>
(function(){
var C={r:'#d93a3a',y:'#f2b705',g:'#2e9e5b',b:'#2b6fd6'},CN={r:'red',y:'yellow',g:'green',b:'blue'};
var BLK=['nav bar','headline','intro text','hero image','button','card one','card two','card three','footer'];
var TH=[1,3,5,7,10,13,16,20,25];
var $=function(i){return document.getElementById(i)};
var root=document.documentElement,hand=$('hand'),pile=$('pile'),opp=$('opp'),sayEl=$('say'),note=$('note'),
    again=$('again'),unoB=$('uno'),deckB=$('deck'),blocks=document.querySelectorAll('.pg b');
var deck,disc,ph,bh,top,color,turn,drew,over,unoPending,plays=0,wins=0,lit=0,shown=null,score={p:0,b:0},won={p:0,b:0};

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function mkDeck(){var d=[],id=0;'rygb'.split('').forEach(function(c){d.push({c:c,v:'0',id:id++});
  for(var k=0;k<2;k++){['1','2','3','4','5','6','7','8','9','S','R','+2'].forEach(function(v){d.push({c:c,v:v,id:id++})})}});
  for(var k=0;k<4;k++){d.push({c:'k',v:'W',id:id++});d.push({c:'k',v:'+4',id:id++})}return shuffle(d)}
function draw(n,h,flag){for(var i=0;i<n;i++){if(!deck.length){var t=disc.pop();deck=shuffle(disc);disc=[t]}
  if(!deck.length)return;var c=deck.pop();if(flag)c.fresh=1;h.push(c)}}
function ok(c){return c.c==='k'||c.c===color||c.v===top.v}
function sym(v){return v==='S'?'⊘':v==='R'?'⇄':v}
function pts(h){return h.reduce(function(a,c){return a+(/^\d$/.test(c.v)?+c.v:c.c==='k'?50:20)},0)}
function mk(c){var e=document.createElement('div');e.className='card'+(c.c==='k'?' wild':'');
  if(c.c!=='k')e.style.setProperty('--c',C[c.c]);
  var s=c.v==='W'?'★':sym(c.v),
      mid=c.c==='k'?'<div class="quad">'+(c.v==='+4'?'+4':'')+'</div>':'<span class="mid'+(c.v.length>1||c.v==='S'||c.v==='R'?' sm':'')+'">'+s+'</span>';
  e.innerHTML='<div class="oval">'+mid+'</div><span class="tl">'+s+'</span><span class="br">'+s+'</span>';return e}
function say(t,n){var p=document.createElement('p');p.id='say';p.textContent=t;sayEl.replaceWith(p);sayEl=p;note.textContent=n||''}

function render(){
  hand.innerHTML='';
  ph.forEach(function(c,i){var e=mk(c),can=turn==='p'&&!over&&ok(c);
    e.classList.add(can?'can':'dim');if(c.fresh){e.classList.add('new');c.fresh=0}
    if(can){e.tabIndex=0;e.setAttribute('role','button');e.onclick=function(){onPlay(i)};
      e.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();onPlay(i)}}}
    hand.appendChild(e)});
  var n=ph.length,f=hand.firstChild;
  if(f){var cw=f.offsetWidth,av=hand.clientWidth-16,st=n>1?Math.min(cw*.8,(av-cw)/(n-1)):0;
    for(var i=0;i<n;i++){var el=hand.children[i],o=i-(n-1)/2;
      el.style.marginLeft=i?(st-cw)+'px':'0';
      el.style.setProperty('--rot',(o*Math.min(6,36/n))+'deg');
      el.style.setProperty('--dy',(o*o*Math.min(2,10/n))+'px')}}
  opp.innerHTML='';for(var k=0;k<Math.min(bh.length,12);k++)opp.appendChild(Object.assign(document.createElement('div'),{className:'back'}));
  $('oc').textContent=bh.length+(bh.length===1?' card · UNO':' cards');
  if(shown!==top.id){shown=top.id;var t=mk(top);t.classList.add('land');t.style.transform='rotate('+(top.rot||0)+'deg)';
    pile.appendChild(t);while(pile.children.length>3)pile.removeChild(pile.firstChild)}
  $('dot').style.background=C[color];$('cn').textContent=CN[color];
  root.style.setProperty('--accent',C[color]);
  deckB.classList.toggle('pulse',turn==='p'&&!over&&!ph.some(ok));
  unoB.classList.toggle('pulse',!!unoPending)}

function renderScore(){
  $('sp').textContent=score.p;$('sb').textContent=score.b;
  $('rd').textContent='Rounds won: '+won.p+' – '+won.b;
  var s=$('score');s.className='score'+(score.p>score.b?' p':score.b>score.p?' b':'')}

function updateBuild(){
  var u=plays+wins*3,l=0;TH.forEach(function(t){if(u>=t)l++});
  blocks.forEach(function(b,i){b.classList.toggle('on',i<l)});
  $('pct').textContent=Math.round(l/10*100)+'%';
  var m=null;if(l>lit)m=l===9?'Everything is built except the launch. That part takes longest.':'Block added: '+BLK[l-1]+'.';
  lit=l;return m}

var ac=null;
function ctx(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ac=ac||new AC();if(ac.state==='suspended')ac.resume();return ac}
function snap(){
  try{
    var a=ctx();if(!a)return;
    var t=a.currentTime,len=Math.floor(a.sampleRate*.07),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    var n=a.createBufferSource();n.buffer=buf;
    var hp=a.createBiquadFilter();hp.type='bandpass';hp.frequency.value=1500;hp.Q.value=.7;
    var g=a.createGain();g.gain.value=.045;n.connect(hp);hp.connect(g);g.connect(a.destination);n.start(t);
    var o=a.createOscillator(),og=a.createGain();o.type='sine';
    o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(70,t+.09);
    og.gain.setValueAtTime(.03,t);og.gain.exponentialRampToValueAtTime(.001,t+.1);
    o.connect(og);og.connect(a.destination);o.start(t);o.stop(t+.11);
  }catch(e){}
}
function pop(){
  try{
    var a=ctx();if(!a)return;var t=a.currentTime,sr=a.sampleRate;
    function nz(at,dur,freq,type,vol){
      var len=Math.floor(sr*dur),b=a.createBuffer(1,len,sr),d=b.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);
      var s=a.createBufferSource();s.buffer=b;
      var f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;
      var g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start(at);
    }
    nz(t,.12,900,'lowpass',.12);
    var o=a.createOscillator(),og=a.createGain();o.type='sine';
    o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(60,t+.12);
    og.gain.setValueAtTime(.07,t);og.gain.exponentialRampToValueAtTime(.001,t+.14);
    o.connect(og);og.connect(a.destination);o.start(t);o.stop(t+.15);
    for(var i=0;i<22;i++){var at=t+.08+Math.random()*.9;nz(at,.03,3000+Math.random()*3000,'highpass',.03*(1-(at-t)/1.2))}
  }catch(e){}
}

function place(c,who,col){
  snap();c.rot=Math.random()*26-13;disc.push(c);top=c;color=c.c==='k'?col:c.c;
  var me=who==='p'?'You':'Bot',h=who==='p'?ph:bh,o=who==='p'?bh:ph,msg,ag=false,cn=CN[color];
  if(c.v==='S'){msg=me+' played Skip. '+(who==='p'?'Bot misses a turn.':'You miss a turn.');ag=true}
  else if(c.v==='R'){msg=me+' played Reverse. In a two-player game, that is a skip.';ag=true}
  else if(c.v==='+2'){draw(2,o,who==='b');msg=me+' played +2. '+(who==='p'?'Bot draws':'You draw')+' 2 and miss'+(who==='p'?'es':'')+' a turn.';ag=true}
  else if(c.v==='+4'){draw(4,o,who==='b');msg=me+' played +4 and chose '+cn+'. '+(who==='p'?'Bot draws':'You draw')+' 4 and miss'+(who==='p'?'es':'')+' a turn.';ag=true}
  else if(c.v==='W'){msg=me+' played Wild and chose '+cn+'.'}
  else msg=me+' played '+CN[c.c]+' '+c.v+'.';
  if(!h.length){endRound(who);return false}
  say(msg);return ag}

function onPlay(i){
  if(turn!=='p'||over)return;var c=ph[i];if(!ok(c))return;
  if(c.c==='k')pick(function(col){doP(i,col)});else doP(i)}
function doP(i,col){
  var c=ph.splice(i,1)[0];drew=false;var ag=place(c,'p',col);
  if(over){render();return}
  plays++;var n=updateBuild();if(n)note.textContent=n;
  if(ph.length===1){unoPending=true}
  if(ag){render()}else{turn='b';render();setTimeout(botMove,unoPending?2000:1000)}}
function onDeck(){
  if(turn!=='p'||over)return;
  if(drew){drew=false;turn='b';say('You kept the card. Bot’s turn.');render();setTimeout(botMove,900);return}
  draw(1,ph,true);drew=true;var c=ph[ph.length-1];
  if(ok(c)){say('You drew a playable card.','Play it, or tap the deck again to keep it.');render()}
  else{say('You drew a card you can’t play. Bot’s turn.');turn='b';render();setTimeout(botMove,1100)}}
deckB.onclick=onDeck;

function botMove(){
  if(over)return;
  if(unoPending){unoPending=false;draw(2,ph,true);say('You didn’t call UNO in time. Draw 2.');render();return setTimeout(botMove,1100)}
  var pl=bh.filter(ok);
  if(!pl.length){draw(1,bh);var c=bh[bh.length-1];
    if(ok(c)){render();return setTimeout(function(){botPlay(c)},700)}
    say('Bot drew a card and passed. Your move.');turn='p';drew=false;render();return}
  var cnt={};bh.forEach(function(c){cnt[c.c]=(cnt[c.c]||0)+1});
  pl.sort(function(a,b){var s=function(c){return(c.c==='k'?-5:0)+('S R +2'.split(' ').indexOf(c.v)>-1?2:0)+(cnt[c.c]||0)*.3};return s(b)-s(a)});
  botPlay(pl[0])}
function botPlay(c){
  bh.splice(bh.indexOf(c),1);var cnt={r:0,y:0,g:0,b:0};bh.forEach(function(x){if(x.c!=='k')cnt[x.c]++});
  var best='rygb'.split('').sort(function(a,b){return cnt[b]-cnt[a]})[0];
  var ag=place(c,'b',best);if(over){render();return}
  if(ag){render();setTimeout(botMove,1300)}else{turn='p';drew=false;render();
    if(!ph.some(ok)){note.textContent='Nothing to play. Tap the deck to draw.'}}}

function endRound(who){
  over=true;unoPending=false;
  var gain=pts(who==='p'?bh:ph);score[who]+=gain;won[who]++;renderScore();
  if(who==='p'){wins++;var n=updateBuild();say('You won the round and scored '+gain+'. +3 to the build.',n||'');burst()}
  else say('Bot wins this round and scores '+gain+'.','Win a round to speed up the build.');
  again.hidden=false;render()}
function start(){
  deck=mkDeck();disc=[];ph=[];bh=[];draw(7,ph);draw(7,bh);
  do{top=deck.pop();if(!/^\d$/.test(top.v)){deck.unshift(top);top=null}}while(!top);
  top.rot=0;disc.push(top);color=top.c;turn='p';drew=false;over=false;unoPending=false;shown=null;
  pile.innerHTML='';again.hidden=true;render();
  say('Your move. Match the color or number.','Every card you play adds to the site.')}
again.onclick=start;

unoB.onclick=function(){
  if(unoPending&&ph.length===1){unoPending=false;burst();render();say('UNO! One card left.')}
  else if(!over)note.textContent='Not yet. You have '+ph.length+' cards.'};

function pick(cb){var p=$('picker'),k=$('pk');k.innerHTML='';
  'rygb'.split('').forEach(function(c){var b=document.createElement('button');b.style.background=C[c];b.setAttribute('aria-label',CN[c]);
    b.onclick=function(){p.hidden=true;cb(c)};k.appendChild(b)});p.hidden=false}

var cv=$('cv'),cx=cv.getContext('2d'),ps=[],run=0,dpr=window.devicePixelRatio||1;
function sz(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}addEventListener('resize',sz);sz();
function burst(){pop();var k=['#d93a3a','#f2b705','#2e9e5b','#2b6fd6','#f6f3ec'];
  for(var i=0;i<130;i++)ps.push({x:cv.width/2,y:cv.height*.85,vx:(Math.random()-.5)*16*dpr,vy:-(8+Math.random()*15)*dpr,s:(5+Math.random()*6)*dpr,c:k[i%5],r:0,vr:Math.random()*.4-.2,l:1});
  if(!run){run=1;tick()}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(function(p){return p.l>0});
  ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.42*dpr;p.r+=p.vr;p.l-=.007;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()});
  if(ps.length)requestAnimationFrame(tick);else run=0}

function themeMeta(){var m=document.querySelector('meta[name=theme-color]');if(m)m.content=root.getAttribute('data-theme')==='light'?'#f3f3f6':'#0e0e12'}
$('theme').onclick=function(){var n=root.getAttribute('data-theme')==='light'?'dark':'light';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n)}catch(e){}themeMeta()};
themeMeta();
addEventListener('resize',function(){if(ph)render()});
renderScore();updateBuild();start();
})();
</script>
</body>
